name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
      # pnpm のバージョンは package.json の packageManager から読み込まれる
      - name: pnpm のセットアップ
        uses: pnpm/action-setup@v4
      - name: Node.js のセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile
      - name: 型チェック・frontmatter 検証
        run: pnpm check
      - name: ビルド
        run: pnpm build
      - name: dist の検査（下書き混入・必須ファイル）
        run: pnpm check:dist
